name: cong-v7-luat
# Hợp đồng Luật v7 — lô 1. Nấc 1 (ADVISORY): tỉ lệ file luật chỉ ĐẾM, không chặn.
# Chặn thật ngay: selftest của cổng + selftest mọi lệnh luật (L3) — cổng chưa từng đỏ thì "xanh" là chưa đo.
on: [pull_request, push]
jobs:
  luat:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - name: selftest cổng (ca đỏ + ca xanh + ca không đo được)
        run: bash 05-Templates-Tools/07-Scripts/kiem-luat-v7.sh --selftest
      - name: L3 — mọi lệnh luật có --selftest và qua
        run: bash 05-Templates-Tools/07-Scripts/kiem-luat-v7.sh --l3
      - name: lô 1 — đếm (nấc 1, không chặn)
        run: bash 05-Templates-Tools/07-Scripts/kiem-luat-v7.sh --pham-vi 03-AI-GOVERNANCE
