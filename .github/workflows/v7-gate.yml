name: v7 version-declared gate (count, step 1)
on:
  pull_request:
  push:
    branches: [main]
jobs:
  v7-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: selftest (red 2 · green 0 · no SSOT 1 · 0 files scanned 1 · declared_older is not an error)
        run: bash scripts/check-version-declared.sh --selftest
      - name: Version declared (Convention A) — COUNT, does not block yet
        run: bash scripts/check-version-declared.sh
      - name: Positive case (G3) — the gate must be able to go RED
        run: |
          d=$(mktemp -d); cp -r . "$d/fw"; rm -f "$d/fw/README.md"
          if bash "$d/fw/scripts/check-version-declared.sh"; then
            echo "G3 FAILED: README removed (SSOT missing) and the gate is still GREEN — it measures nothing"; exit 1
          fi
          echo "G3 OK: gate goes red when the SSOT is missing"
      - name: Positive case (G3) for the counter — plant 1 undeclared file + 1 file declaring the current version
        run: |
          S=scripts/check-version-declared.sh
          num() { bash "$S" | grep -oE "$1=[0-9]+" | cut -d= -f2; }
          u0=$(num undeclared); c0=$(num declared_current)
          ssot=$(grep -m1 -oE '\*\*Version\*\*: [0-9.]+' README.md | grep -oE '[0-9.]+$')
          printf '# plant\n' > 02-Core-Methodology/ZZ-plant-undeclared.md
          printf '# plant\n**SDLC Framework Version**: %s\n' "$ssot" > 02-Core-Methodology/ZZ-plant-declared.md
          u1=$(num undeclared); c1=$(num declared_current)
          echo "undeclared $u0->$u1 · declared_current $c0->$c1"
          [ "$u1" = $((u0+1)) ] && [ "$c1" = $((c0+1)) ] || { echo "G3 FAILED: the counter did not see the planted files"; exit 1; }
          echo "G3 OK: the counter saw both planted files"
