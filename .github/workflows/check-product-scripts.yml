name: check-product-scripts
# Selftests for PRODUCT_CI sample scripts under scripts/ that the framework ships but does not run on
# itself (they measure a product repo). A gate that has never been seen red has not been measured (G3):
# each selftest includes cases that must return 2 and 1, not only 0.
on:
  pull_request:
    paths: ["scripts/check-pr-approver.sh", ".github/workflows/check-product-scripts.yml"]
  push:
    branches: [main]
    paths: ["scripts/check-pr-approver.sh", ".github/workflows/check-product-scripts.yml"]
permissions:
  contents: read
jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check-pr-approver --selftest (local fixtures, no network)
        run: bash scripts/check-pr-approver.sh --selftest
