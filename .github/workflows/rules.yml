name: rules
# Rule-contract runner over the single rule register, controls/rule-contract.md.
# Folds in the former v7-rule-contract.yml (C21-4 is a row of the table, so the runner already runs it
# and L3 already runs its --selftest) and check-product-scripts.yml (selftest-all covers every script,
# including PRODUCT_CI samples such as check-pr-approver.sh). One file, one place to look.
on: [pull_request, push]
jobs:
  rules:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # SECRET-1 diffs against the merge-base with origin/main
      - name: selftest every script (a gate nobody has made red is unmeasured)
        run: bash scripts/selftest-all.sh
      - name: L3 — every rule cmd has --selftest and it passes
        run: |
          rc=0
          bash scripts/check-rules.sh --l3 || rc=$?
          [ "$rc" = 2 ] && exit 1
          [ "$rc" = 0 ] || echo "::warning::check-rules --l3: cannot measure (exit $rc)"
          exit 0
      - name: Rule register — run every FRAMEWORK_REPO row (2 = violation fails · 1 = cannot measure warns)
        run: |
          rc=0
          bash scripts/check-rules.sh --block || rc=$?
          [ "$rc" = 2 ] && exit 1
          [ "$rc" = 0 ] || echo "::warning::check-rules: cannot measure (exit $rc)"
          exit 0
