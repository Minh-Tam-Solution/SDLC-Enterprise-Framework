name: v7-rule-contract
# G3: every gate has a red case in a workflow. Runs C21-4's selftest, then C21-4 over the real ## Rules v7 table.
# ponytail: separate file only until the v7 rules runner (scripts/check-rules-v7.sh) exists — fold these steps into its workflow then.
on: [pull_request, push]
jobs:
  advisory-deadline:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - name: C21-4 selftest (red + green + cannot-measure cases)
        run: bash scripts/check-advisory-deadline.sh --selftest
      - name: C21-4 on v7/01-rule-contract.md
        run: bash scripts/check-advisory-deadline.sh
